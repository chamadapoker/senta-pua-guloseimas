name: Deploy App (Cloudflare Pages)
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, build, testes do backend e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # O app depende do contrato da API: se os testes do backend quebrarem, o app também não sobe
      - name: Testes do backend
        run: pnpm --filter senta-pua-worker test
      - name: Build do app (inclui checagem de tipos)
        run: pnpm --filter senta-pua-app build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
      - name: Vulnerabilidades nas dependências de produção (bloqueia alta ou crítica)
        run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: app-dist
          path: app/dist
          retention-days: 7

  deploy:
    name: Publicar
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: app/dist
      - name: Deploy to Cloudflare Pages
        # Versão fixa do wrangler (antes era @latest: uma versão nova podia quebrar o deploy sem aviso)
        run: npx --yes wrangler@4.80.0 pages deploy app/dist --project-name=app-senta-pua --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f42d3e9f5dc41befb6f50847257f5a09
