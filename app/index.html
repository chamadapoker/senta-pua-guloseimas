<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="{{ESQ_COR_TEMA}}" />
    <meta name="description" content="{{ESQ_SLOGAN}}" />
    <link rel="icon" type="image/png" href="{{ESQ_ICONE}}" />
    <link rel="apple-touch-icon" href="{{ESQ_ICONE}}" />
    <title>{{ESQ_TITULO}}</title>
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="{{ESQ_NOME}}" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph (WhatsApp, Instagram, Facebook) -->
    <meta property="og:title" content="{{ESQ_NOME}}" />
    <meta property="og:description" content="{{ESQ_SLOGAN}}" />
    <meta property="og:image" content="{{ESQ_OG_IMAGE}}" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ESQ_URL}}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ESQ_NOME}}" />
    <meta name="twitter:description" content="{{ESQ_SLOGAN}}" />
    <meta name="twitter:image" content="{{ESQ_OG_IMAGE}}" />
  </head>
  <body class="bg-fundo text-texto">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
